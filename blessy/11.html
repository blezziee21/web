<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 70%;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px royalblue;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        fieldset {
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        legend {
            font-weight: bold;
            color: #444;
        }

        label {
            display: inline-block;
            width: 180px;
            margin-bottom: 12px;
        }

        input, select, textarea {
            padding: 8px;
            width: 55%;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        .buttons {
            text-align: center;
        }

        input[type="submit"],
        input[type="reset"] {
            width: 120px;
            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"] {
            background-color: #28a745;
            color: white;
        }

        input[type="reset"] {
            background-color: #dc3545;
            color: white;
        }

        input[type="submit"]:hover {
            background-color: #218838;
        }

        input[type="reset"]:hover {
            background-color: #c82333;
        }

        #error {
            color: red;
            font-size: 14px;
            margin-left: 180px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1><u>STUDENT REGISTRATION FORM</u></h1>

    <form action="login.html" method="post"
          enctype="multipart/form-data"
          onsubmit="return checkPassword()">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" required><br>

            <label for="mname">Middle Name:</label>
            <input type="text" id="mname" name="mname"><br>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" required><br>

            <label>Gender:</label>

            <input type="radio" id="male" name="gender" value="Male">
            <label for="male" style="width:auto;">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female" style="width:auto;">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other" style="width:auto;">Other</label>

            <br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br>
        </fieldset>


        <fieldset>
            <legend>Contact Details</legend>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   maxlength="10" required><br>
        </fieldset>


        <fieldset>
            <legend>Address</legend>

            <label for="address">Full Address:</label>
            <textarea id="address" name="address" required></textarea><br>

            <label for="city">City:</label>
            <input type="text" id="city" name="city"><br>

            <label for="state">State:</label>
            <select id="state" name="state">
                <option value="">-- Select State --</option>
                <option value="Kerala">Kerala</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Andhra Pradesh">Andhra Pradesh</option>
                <option value="Telangana">Telangana</option>
            </select><br>

            <label for="pincode">PIN Code:</label>
            <input type="text" id="pincode" name="pincode"><br>
        </fieldset>


        <fieldset>
            <legend>Academic Qualification</legend>

            <label for="qualification">Highest Qualification:</label>
            <select id="qualification" name="qualification" required>
                <option value="">-- Select Qualification --</option>
                <option value="10th">10th</option>
                <option value="12th">12th</option>
                <option value="Diploma">Diploma</option>
                <option value="Graduation">Graduation</option>
                <option value="Post Graduation">Post Graduation</option>
            </select><br>

            <label for="school">School/College Name:</label>
            <input type="text" id="school" name="school"><br>

            <label for="percentage">Percentage/CGPA:</label>
            <input type="text" id="percentage" name="percentage"><br>
        </fieldset>


        <fieldset>
            <legend>Course Selection</legend>

            <label for="course">Select Course:</label>
            <select id="course" name="course" required>
                <option value="">-- Select Course --</option>
                <option value="BCA">BCA</option>
                <option value="BSc Computer Science">
                    B.Sc Computer Science
                </option>
                <option value="BBA">BBA</option>
                <option value="BCom">B.Com</option>
                <option value="BA">BA</option>
                <option value="MCA">MCA</option>
                <option value="MSc">M.Sc</option>
            </select><br>
        </fieldset>


        <fieldset>
            <legend>Account Details</legend>

            <label for="password">Password:</label>
            <input type="password" id="password"
                   name="password" required><br>

            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password"
                   name="confirm_password" required><br>

            <span id="error"></span>

        </fieldset>


        <fieldset>
            <legend>Documents</legend>

            <label for="photo">Upload Photo:</label>
            <input type="file" id="photo" name="photo"
                   accept="image/*"><br>

            <label for="certificate">Upload Certificate:</label>
            <input type="file" id="certificate" name="certificate"
                   accept=".pdf,.jpg,.jpeg,.png"><br>

            <label for="tcdate">Date of Transfer Certificate:</label>
            <input type="date" id="tcdate" name="tcdate"><br>
        </fieldset>


        <div class="buttons">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>

    </form>

</div>


<script>
    function checkPassword() {

        var password = document.getElementById("password").value;
        var confirmPassword =
            document.getElementById("confirm_password").value;

        if (password !== confirmPassword) {

            document.getElementById("error").innerHTML =
                "Passwords do not match!";

            return false;
        }

        return true;
    }
</script>

</body>
</html>
