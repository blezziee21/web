<!DOCTYPE html>
<html>
<head>
    <title>Side Bar Example</title>

    <style>
        /* Side Navigation Bar */
        .sidenav {
            height: 100%;
            width: 160px;
            padding-top: 20px;
            background-color: green;

            position: fixed;
            top: 0;
            left: 0;
        }

        /* Navigation Links */
        .sidenav a {
            display: block;
            text-decoration: none;
            padding: 6px 8px 6px 16px;
            color: white;
        }

        /* Mouse Over Effect */
        .sidenav a:hover {
            color: red;
        }

        /* Main Content */
        .main {
            margin-left: 160px;
            padding-top: 0px;
            padding-bottom: 0px;
            padding-right: 10px;
            padding-left: 10px;
            height: 2000px;
        }
    </style>
</head>

<body>

    <!-- Side Navigation -->
    <div class="sidenav">
        <a href="#">About Us</a>
        <a href="#">Departments</a>
        <a href="#">Vision and Mission</a>
        <a href="#">Contact Us</a>
    </div>

    <!-- Main Content -->
    <div class="main">
        <h1>Side Bar Example</h1>
    </div>

</body>
</html>
